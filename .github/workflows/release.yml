name: Release addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build addon zip
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/BFAKeyAlerts"
          cp BFAKeyAlerts.toc ./*.lua "dist/BFAKeyAlerts/"
          cp -R Data Media Sounds "dist/BFAKeyAlerts/"
          (cd dist && zip -r "BFAKeyAlerts-${version}.zip" BFAKeyAlerts)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/BFAKeyAlerts-${GITHUB_REF_NAME#v}.zip" --generate-notes
